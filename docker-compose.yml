services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: pubsub_user
      POSTGRES_PASSWORD: pubsub_password
      POSTGRES_DB: music_pubsub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/CreateTables.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - pubsub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pubsub_user -d music_pubsub"]
      interval: 10s
      timeout: 5s
      retries: 5

  seed-broker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      BROKER_ID: seed-broker
      BROKER_PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: pubsub_user
      DB_PASSWORD: pubsub_password
      DB_NAME: music_pubsub
      JWT_SECRET: dev_jwt_secret_change_in_production
      IS_SEED: "true"
    ports:
      - "5001:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pubsub-network

  broker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      BROKER_PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: pubsub_user
      DB_PASSWORD: pubsub_password
      DB_NAME: music_pubsub
      JWT_SECRET: dev_jwt_secret_change_in_production
      SEED_BROKER: seed-broker:5000
    depends_on:
      postgres:
        condition: service_healthy
      seed-broker:
        condition: service_started
    networks:
      - pubsub-network

volumes:
  postgres_data:

networks:
  pubsub-network:
    driver: bridge