services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: pubsub_user
      POSTGRES_PASSWORD: pubsub_password
      POSTGRES_DB: music_pubsub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pubsub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pubsub_user -d music_pubsub"]
      interval: 10s
      timeout: 5s
      retries: 5

  broker-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      BROKER_ID: broker-1
      BROKER_PORT: 5000
      DB_HOST: postgres
      PEER_BROKERS: broker-2:5000,broker-3:5000
    ports:
      - "5001:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pubsub-network

  broker-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      BROKER_ID: broker-2
      BROKER_PORT: 5000
      DB_HOST: postgres
      PEER_BROKERS: broker-1:5000,broker-3:5000
    ports:
      - "5002:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pubsub-network

  broker-3:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      BROKER_ID: broker-3
      BROKER_PORT: 5000
      DB_HOST: postgres
      PEER_BROKERS: broker-1:5000,broker-2:5000
    ports:
      - "5003:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pubsub-network

volumes:
  postgres_data:

networks:
  pubsub-network:
    driver: bridge
